name: NSE/BSE Screener

on:
  schedule:
    - cron: "*/15 4-9 * * 1-5"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          INCLUDE_BSE: "true"
          MAX_TICKERS: ""
          SCAN_TIMEFRAMES: "15m,1h,4h,1d"
        run: python screener.py
